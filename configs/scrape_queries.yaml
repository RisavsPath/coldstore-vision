# Web image scraping queries for the sack dataset.
# produce: onion | potato | garlic | generic  (stored as produce_hint in the manifest)
# Per-source caps keep the raw pool at roughly 3-4k images before dedup.
per_query_max:
  openverse: 60
  wikimedia: 40
  bing: 80
  baidu: 80

# Openverse / Wikimedia match every keyword, so long queries return nothing there: they get short ones.
cc_queries:
  - {q: "potato sacks", produce: potato}
  - {q: "sacks of potatoes", produce: potato}
  - {q: "potato bags", produce: potato}
  - {q: "potato storage", produce: potato}
  - {q: "onion sacks", produce: onion}
  - {q: "onion bags", produce: onion}
  - {q: "sacks of onions", produce: onion}
  - {q: "onion market", produce: onion}
  - {q: "garlic sacks", produce: garlic}
  - {q: "garlic bags", produce: garlic}
  - {q: "garlic market", produce: garlic}
  - {q: "jute sacks", produce: generic}
  - {q: "gunny bags", produce: generic}
  - {q: "burlap sacks", produce: generic}
  - {q: "stacked sacks", produce: generic}
  - {q: "sacks warehouse", produce: generic}
  - {q: "sack pile", produce: generic}
  - {q: "grain sacks", produce: generic}
  - {q: "cold storage", produce: generic}
  - {q: "pallet rack", produce: generic}

