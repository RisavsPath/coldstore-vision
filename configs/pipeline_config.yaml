# ColdStore-Vision pipeline configuration. All thresholds from the master spec live here.

detector:
  # Trained model. When this file exists it is used automatically.
  weights: models/weights/best.pt
  # Fallback until training finishes: open-vocabulary YOLOE (still YOLO instance masks).
  fallback_weights: yoloe-11s-seg.pt
  fallback_prompts:
    sack: ["sack", "jute sack", "mesh bag of onions", "bag of potatoes"]
    rack_beam: ["steel rack beam", "metal shelf upright"]
    empty_slot: ["empty shelf space"]
  conf: 0.25
  iou: 0.5
  imgsz: 640
  device: cpu

processing:
  width: 1280                        # all frames are resized to this width (4K is unnecessary for analytics)

ingestion:
  keyframe_min_dist_m: 0.50
  fallback_keyframe_every_s: 0.5     # used when camera_poses.csv is missing
  blur_var_threshold: 100.0
  blur_search_window: 5

registration:
  matcher: loftr                    # loftr (CLIP retrieval + LoFTR, robust across days) | sift
  retrieval_topk: 4
  loftr_min_inliers: 40
  feature: sift                     # sift | orb (local / mosaic / SIFT matcher)
  lowe_ratio: 0.75
  ransac_reproj_px: 3.0
  min_inliers: 25

optical_flow:
  pyr_scale: 0.5
  levels: 4
  winsize: 21
  iterations: 3
  poly_n: 7
  poly_sigma: 1.5
  slump_vy_px: 4.0                   # mean downward velocity threshold (px/scan)

lighting:
  histogram_match: true

tracking:
  iou_match_threshold: 0.30
  centroid_max_cost: 0.6            # Day1<->Day2 sack match: centre distance / sack size (+ size penalty)
  centroid_match_max_diff: 0.3      # centroid-only matches must look alike after local alignment
  min_pair_match_frac: 0.5          # below this a keyframe pair is UNVERIFIED, never MISSING/CRITICAL

anomaly:
  mask_erode_px: 7                   # spec: 5-10 px
  missing_diff_area_frac: 0.45
  missing_depth_delta_m: 0.30
  diff_intensity_threshold: 40       # per-pixel |ΔI| considered "changed"
  necrosis_hsv: {h_min: 10, h_max: 30, s_min: 60, v_max: 110}
  necrosis_critical_frac: 0.08
  necrosis_warning_frac: 0.03
  glcm_distances: [1]
  glcm_angles_deg: [0, 45, 90, 135]
  glcm_contrast_rise: 0.35
  glcm_homogeneity_drop: -0.20
  hue_warning_deg: 15.0             # white-balance drift alone moves brown jute ~10 deg
  replaced_hue_deg: 10.0             # smaller hue shift + large area change = sack swapped/replaced
  replaced_diff_frac: 0.4
  min_missing_area_frac: 0.01        # sacks smaller than this (or cut by the frame edge) never become MISSING
  occlusion_hue_deg: 90.0            # Day 2 spot in a different colour family = something in front
  hue_min_saturated_frac: 0.3       # skip hue on pale / white sacks (hue is noise there)
  missing_diff_area_frac_uncovered: 0.2  # lower change bar when no Day 2 sack covers the spot
  slump_warning_px: 4.0
  slump_critical_px: 10.0

bays:
  # Bay/tier inference without markers: vertical rack_beam detections split bays;
  # if no beams are detected, sacks are clustered into columns/rows.
  fallback_bay_count: auto
  min_beam_aspect: 3.0

outputs:
  dir: outputs
  video_fps: 15
  side_by_side_fps: 5
  split_screen_width: 1920
  codecs: [mp4v]                     # put avc1 first if openh264 is installed (browser-friendly H.264)
