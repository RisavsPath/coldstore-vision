<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ColdStore-Vision Intro</title>
<link rel="stylesheet" href="style.css">
<style>
  .wrap { position: absolute; left: 160px; top: 290px; width: 1600px; }
  .logo { display: flex; align-items: center; gap: 26px; }
  .mark { width: 96px; height: 96px; border-radius: 24px; background: linear-gradient(135deg, var(--accent), var(--miss));
          display: grid; place-items: center; font-size: 56px; }
  .bar { height: 6px; width: 640px; background: linear-gradient(90deg, var(--accent), var(--miss)); border-radius: 3px; margin: 40px 0 36px; }
  .row { display: flex; gap: 22px; margin-top: 44px; }
  .chip { font-size: 26px; padding: 12px 22px; border-radius: 14px; background: var(--bg2); border: 1px solid var(--line); }
  .chip b { color: var(--accent); }
</style></head>
<body data-duration="8">
<div class="stage" style="animation: fadeOut .6s ease 7.4s forwards">
  <div class="wrap">
    <div class="logo">
      <div class="mark pop" style="animation-delay:.2s">❄</div>
      <h1 class="fade-up" style="animation-delay:.4s">ColdStore-Vision</h1>
    </div>
    <div class="bar grow-x" style="animation-delay:1s"></div>
    <div class="sub fade-up" style="animation-delay:1.3s">Automated cold-storage inspection: an inspection drone and computer vision<br>compare every sack with its previous scan — missing stock, spoilage and settling.</div>
    <div class="row">
      <div class="chip pop" style="animation-delay:2.2s"><b>1</b> · Concept: the inspection drone</div>
      <div class="chip pop" style="animation-delay:2.45s"><b>2</b> · Prototype: tested in a real godown</div>
      <div class="chip pop" style="animation-delay:2.7s"><b>3</b> · Results &amp; next steps</div>
    </div>
  </div>
</div>
</body></html>
