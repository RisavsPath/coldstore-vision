<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Prototype Phase</title>
<link rel="stylesheet" href="style.css">
<style>
  .wrap { position: absolute; left: 160px; top: 300px; width: 1600px; }
  .bar { height: 6px; width: 520px; background: linear-gradient(90deg, var(--accent), var(--miss)); border-radius: 3px; margin: 38px 0; }
  .tags { display: flex; gap: 18px; margin-top: 40px; }
  .tag { font-size: 26px; padding: 12px 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg2); color: var(--ink); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 80px 80px; opacity: .18; }
</style></head>
<body data-duration="8.5">
<div class="stage" style="animation: fadeOut .6s ease 7.9s forwards">
  <div class="grid fade-in"></div>
  <div class="wrap">
    <div class="kicker fade-up" style="animation-delay:.2s">Prototype phase</div>
    <h1 class="fade-up" style="animation-delay:.5s; margin-top:22px">Tested in a real godown</h1>
    <div class="bar grow-x" style="animation-delay:1.1s"></div>
    <div class="sub fade-up" style="animation-delay:1.4s">Before a drone: two handheld walkthroughs of the same sack stacks,<br>recorded on two different days, under different lighting.</div>
    <div class="tags">
      <div class="tag pop" style="animation-delay:2.2s">📱 iPhone video</div>
      <div class="tag pop" style="animation-delay:2.4s">🗓 21 &amp; 22 Oct 2026</div>
      <div class="tag pop" style="animation-delay:2.6s">🧅 onion &amp; 🥔 potato stacks</div>
      <div class="tag pop" style="animation-delay:2.8s">🧠 trained YOLO11s-seg</div>
    </div>
  </div>
</div>
</body></html>
