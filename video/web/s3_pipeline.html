<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Processing Pipeline</title>
<link rel="stylesheet" href="style.css">
<style>
  .head { position: absolute; left: 140px; top: 100px; }
  svg { position: absolute; left: 0; top: 0; }
  .node rect { fill: var(--panel); stroke: var(--line); stroke-width: 2; }
  .node.lit rect { animation: lit .6s ease forwards; }
  @keyframes lit { to { stroke: var(--accent); fill: #1b2a4a; } }
  .node text.t { fill: var(--ink); font-size: 30px; font-weight: 700; }
  .node text.d { fill: var(--muted); font-size: 21px; }
  .node text.i { font-size: 46px; }
  .link { stroke: var(--accent); stroke-width: 4; fill: none; stroke-dasharray: 160; stroke-dashoffset: 160;
          animation: draw .7s ease both; marker-end: url(#arrow); }
  @keyframes draw { 0% { opacity: 0; stroke-dashoffset: 160; } 15% { opacity: 1; } 100% { opacity: 1; stroke-dashoffset: 0; } }
</style></head>
<body data-duration="20">
<div class="stage" style="animation: fadeOut .6s ease 19.4s forwards">
  <div class="head">
    <div class="kicker fade-up">What the software does</div>
    <h2 class="fade-up" style="animation-delay:.3s; margin-top:14px">From two videos to a per-sack verdict</h2>
  </div>
  <svg width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4fa3ff"/></marker></defs>
    <!-- row 1 -->
    <g class="node fade-up lit" style="animation-delay:1s">
      <rect style="animation-delay:1.6s" x="140" y="330" width="460" height="230" rx="22"/>
      <text class="i" x="175" y="405">🎞</text><text class="t" x="245" y="400">1 · Keyframes</text>
      <text class="d" x="175" y="455">Sample frames along the walk,</text>
      <text class="d" x="175" y="487">reject blurry ones (Laplacian)</text>
      <text class="d" x="175" y="519">→ panorama of each day</text>
    </g>
    <path class="link" d="M605,445 L725,445" style="animation-delay:2.2s"/>
    <g class="node fade-up lit" style="animation-delay:2.4s">
      <rect style="animation-delay:3s" x="730" y="330" width="460" height="230" rx="22"/>
      <text class="i" x="765" y="405">🔗</text><text class="t" x="835" y="400">2 · Align days</text>
      <text class="d" x="765" y="455">CLIP finds matching views,</text>
      <text class="d" x="765" y="487">LoFTR aligns them despite</text>
      <text class="d" x="765" y="519">new angle &amp; lighting</text>
    </g>
    <path class="link" d="M1195,445 L1315,445" style="animation-delay:3.6s"/>
    <g class="node fade-up lit" style="animation-delay:3.8s">
      <rect style="animation-delay:4.4s" x="1320" y="330" width="460" height="230" rx="22"/>
      <text class="i" x="1355" y="405">🧠</text><text class="t" x="1425" y="400">3 · Find sacks</text>
      <text class="d" x="1355" y="455">Our trained YOLO11s-seg</text>
      <text class="d" x="1355" y="487">outlines every sack, even</text>
      <text class="d" x="1355" y="519">when they touch</text>
    </g>
    <!-- turn down -->
    <path class="link" d="M1550,565 L1550,655" style="animation-delay:5s"/>
    <!-- row 2 (right to left) -->
    <g class="node fade-up lit" style="animation-delay:5.2s">
      <rect style="animation-delay:5.8s" x="1320" y="660" width="460" height="230" rx="22"/>
      <text class="i" x="1355" y="735">🧩</text><text class="t" x="1425" y="730">4 · Match sacks</text>
      <text class="d" x="1355" y="785">Pair each Day 1 sack with</text>
      <text class="d" x="1355" y="817">its Day 2 self, re-align it,</text>
      <text class="d" x="1355" y="849">vote across many views</text>
    </g>
    <path class="link" d="M1315,775 L1195,775" style="animation-delay:6.4s"/>
    <g class="node fade-up lit" style="animation-delay:6.6s">
      <rect style="animation-delay:7.2s" x="730" y="660" width="460" height="230" rx="22"/>
      <text class="i" x="765" y="735">🔬</text><text class="t" x="835" y="730">5 · Diagnose</text>
      <text class="d" x="765" y="785">Missing · rot colour (HSV) ·</text>
      <text class="d" x="765" y="817">texture (GLCM) · settling ·</text>
      <text class="d" x="765" y="849">blocked-view check</text>
    </g>
    <path class="link" d="M725,775 L605,775" style="animation-delay:7.8s"/>
    <g class="node fade-up lit" style="animation-delay:8s">
      <rect style="animation-delay:8.6s" x="140" y="660" width="460" height="230" rx="22"/>
      <text class="i" x="175" y="735">📊</text><text class="t" x="245" y="730">6 · Report</text>
      <text class="d" x="175" y="785">Overlay video, side-by-side,</text>
      <text class="d" x="175" y="817">audit report, rack digital</text>
      <text class="d" x="175" y="849">twin, panorama slider</text>
    </g>
  </svg>
  <div class="sub fade-in" style="position:absolute; left:140px; bottom:70px; font-size:28px; animation-delay:9.4s">
    Status colours:
    <span class="pill" style="background:var(--ok)">NORMAL</span>
    <span class="pill" style="background:var(--warn)">WARNING</span>
    <span class="pill" style="background:var(--crit)">CRITICAL</span>
    <span class="pill" style="background:var(--miss)">MISSING</span>
    <span class="pill" style="background:var(--unv)">UNVERIFIED</span>
  </div>
</div>
</body></html>
